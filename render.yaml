services:
  - type: web
    name: axiom-api
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn axiom.api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: AXIOM_ENV
        value: production
      - key: AXIOM_API_KEYS
        value: dev-key-axiom
